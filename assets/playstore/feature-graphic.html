  html, body {
    margin: 0;
    padding: 0;
    width: 1024px;
    height: 500px;
    overflow: hidden;
    background: #0b0a1a;
  }

  #stage {
    position: relative;
    width: 1024px;
    height: 500px;
    overflow: hidden;
  }

  #art {
    position: absolute;
    inset: 0;
    display: block;
  }

  /* Right-hand copy column. Safe area: the outer ~10% of the graphic can be
     cropped by some Play placements, and a play-button overlay can sit at the
     canvas centre (512,250) on the app detail page — the column starts at
     x=580 and the gem ends at x=399, keeping the centre clear. */
  #copy {
    position: absolute;
    left: 580px;
    top: 0;
    width: 342px;
    height: 500px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }

  .title {
    font-family: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
    font-weight: 400;
    font-size: 134px;
    line-height: 0.9;
    letter-spacing: 0.015em;
    color: #f8fafc;
    white-space: nowrap;
    margin: 0;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.55));
  }

  .title-fury {
    background-image: linear-gradient(180deg, #6ee7b7 0%, #34d399 46%, #059669 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .rule {
    width: 96px;
    height: 6px;
    border-radius: 3px;
    margin: 26px 0 20px;
    background-image: linear-gradient(90deg, #34d399 0%, #a78bfa 100%);
    box-shadow: 0 0 18px rgba(52, 211, 153, 0.35);
  }

  .tagline {
    font-family: "Outfit", "Helvetica Neue", Arial, sans-serif;
    font-weight: 600;
    font-size: 36px;
    line-height: 1.32;
    letter-spacing: 0.012em;
    color: #cabffd;
    white-space: nowrap;
    margin: 0;
  }
</style>
</head>
<body>
<div id="stage">
  <svg id="art" width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Background: Falling Fury dark purple gradient (same stops as icon.svg) -->
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#0b0a1a"/>
        <stop offset="0.48" stop-color="#131136"/>
        <stop offset="1" stop-color="#1c1a3a"/>
      </linearGradient>
      <!-- Top-left lilac ambient wash -->
      <radialGradient id="tlGlow" gradientUnits="userSpaceOnUse" cx="150" cy="10" r="640">
        <stop offset="0" stop-color="#a78bfa" stop-opacity="0.20"/>
        <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.06"/>
        <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
      </radialGradient>
      <!-- Corner vignette for depth -->
      <radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="512" cy="238" r="680">
        <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
        <stop offset="1" stop-color="#000000" stop-opacity="0.40"/>
      </radialGradient>
      <!-- Soft lilac glow behind the gem -->
      <radialGradient id="gemGlow" gradientUnits="userSpaceOnUse" cx="252" cy="250" r="360">
        <stop offset="0" stop-color="#a78bfa" stop-opacity="0.32"/>
        <stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.12"/>
        <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
      </radialGradient>
      <!-- Faint emerald aura directly under the gem -->
      <radialGradient id="gemAura" gradientUnits="userSpaceOnUse" cx="252" cy="250" r="300">
        <stop offset="0" stop-color="#34d399" stop-opacity="0.14"/>
        <stop offset="0.5" stop-color="#34d399" stop-opacity="0.05"/>
        <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
      </radialGradient>
      <!-- Facet sheen overlays (light from top-left) -->
      <linearGradient id="tableHL" x1="0.05" y1="0" x2="0.7" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
        <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.06"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <linearGradient id="crownHL" x1="0" y1="0" x2="0.65" y2="1">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
        <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.08"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="glint" cx="0.5" cy="0.5" r="0.5">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
        <stop offset="0.4" stop-color="#ffffff" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
      </radialGradient>
      <!-- Directional outer edge: mint rim light top-left -> deep emerald bottom-right -->
      <linearGradient id="edge" x1="0" y1="0" x2="0.9" y2="1">
        <stop offset="0" stop-color="#d1fae5"/>
        <stop offset="0.3" stop-color="#34d399"/>
        <stop offset="0.62" stop-color="#059669"/>
        <stop offset="1" stop-color="#065f46"/>
      </linearGradient>
      <!-- Small distant gem used for the falling-gem background decor -->
      <g id="miniGem">
        <polygon points="-160,-250 160,-250 340,-40 0,330 -340,-40" fill="#34d399"/>
        <path d="M -160 -250 L 160 -250 M -150 -120 L 150 -120 M -150 -120 L 0 330 M 150 -120 L 0 330 M 150 -120 L 340 -40 M -150 -120 L -340 -40"
              fill="none" stroke="#065f46" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
      </g>
    </defs>

    <!-- Opaque full-bleed background (no alpha, no border, no rounded corners) -->
    <rect width="1024" height="500" fill="url(#bg)"/>
    <rect width="1024" height="500" fill="url(#tlGlow)"/>
    <rect width="1024" height="500" fill="url(#vig)"/>

    <!-- Distant falling gems (decor only, kept faint; none behind the title) -->
    <use href="#miniGem" transform="translate(112,74) rotate(-12) scale(0.05)" opacity="0.22"/>
    <use href="#miniGem" transform="translate(330,60) rotate(-8) scale(0.045)" opacity="0.20"/>
    <use href="#miniGem" transform="translate(884,432) rotate(10) scale(0.055)" opacity="0.26"/>
    <use href="#miniGem" transform="translate(94,438) rotate(-16) scale(0.046)" opacity="0.20"/>
    <use href="#miniGem" transform="translate(516,440) rotate(8) scale(0.04)" opacity="0.16"/>
    <use href="#miniGem" transform="translate(902,262) rotate(12) scale(0.05)" opacity="0.22"/>

    <!-- Glows behind the gem -->
    <rect width="1024" height="500" fill="url(#gemGlow)"/>
    <rect width="1024" height="500" fill="url(#gemAura)"/>

    <!-- Faceted emerald diamond (same art as assets/appstore/icon.svg,
         local bbox 680x580 centred on (0,40); scale 0.42 -> ~286x244 px,
         ink spans x 105..399, y 125..377, fully inside the 10% safe area
         and clear of the play-overlay zone around (512,250)) -->
    <g id="gem" transform="translate(252,234) scale(0.42)">
      <!-- table -->
      <polygon points="-160,-250 160,-250 150,-120 -150,-120" fill="#6ee7b7"/>
      <!-- left crown -->
      <polygon points="-160,-250 -150,-120 -340,-40" fill="#34d399"/>
      <!-- right crown -->
      <polygon points="160,-250 340,-40 150,-120" fill="#10b981"/>
      <!-- pavilion left -->
      <polygon points="-150,-120 -340,-40 0,330" fill="#059669"/>
      <!-- pavilion center -->
      <polygon points="-150,-120 0,330 150,-120" fill="#10b981"/>
      <!-- pavilion right -->
      <polygon points="150,-120 0,330 340,-40" fill="#047857"/>
      <!-- facet edges -->
      <path d="M -160 -250 L -150 -120 L -340 -40 M 160 -250 L 150 -120 L 340 -40 M -150 -120 L 150 -120 M -150 -120 L 0 330 M 150 -120 L 0 330"
            fill="none" stroke="#065f46" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
      <!-- top-left facet highlight + specular glint -->
